<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-soft: #e8efff; --warn: #b45309; --warn-soft: #fff4e5; --ok: #047857;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1b1f26; --text: #e8eaed; --muted: #9aa3af; --line: #2d333d;
      --accent: #7aa2ff; --accent-soft: #1f2a44; --warn: #f5b451; --warn-soft: #3a2a12; --ok: #34d399;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { flex: 1; padding: 10px 6px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); border-radius: 10px; font-size: 14px; cursor: pointer; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel { display: none; } .panel.on { display: block; }
  input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); font: inherit; }
  textarea { min-height: 140px; resize: vertical; }
  .search { font-size: 17px; padding: 14px; }
  .btn { padding: 10px 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    font: inherit; cursor: pointer; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
  .item { font-weight: 600; font-size: 16px; word-break: keep-all; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .mall { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft);
    color: var(--accent); font-weight: 600; font-size: 13px; }
  .mall.pg { background: var(--warn-soft); color: var(--warn); }
  .price { font-weight: 700; float: right; margin-left: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .status { margin: 8px 0; min-height: 20px; color: var(--muted); font-size: 13px; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .edit-grid label { font-size: 12px; color: var(--muted); }
  .edit-grid .full { grid-column: 1 / -1; }
  .cand { border-left: 3px solid var(--ok); padding-left: 10px; margin-top: 8px; }
  a { color: var(--accent); }
  .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .link { background: none; border: 0; color: var(--accent); padding: 0; font: inherit; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧾 구매기록 검색</h1>
  <div class="tabs">
    <button class="on" data-tab="search">검색</button>
    <button data-tab="add">추가</button>
    <button data-tab="review">결제처 확인</button>
  </div>

  <!-- 검색 -->
  <section class="panel on" id="tab-search">
    <input id="q" class="search" type="search" placeholder="상품명·브랜드로 검색 (예: 로지텍 m650)" autocomplete="off">
    <div class="status" id="searchStatus"></div>
    <div id="results"></div>
  </section>

  <!-- 추가 -->
  <section class="panel" id="tab-add">
    <div class="card">
      <div class="item">① 캡처 이미지로 추가</div>
      <div class="muted">쿠팡·네이버 등 주문내역 화면이나 영수증을 캡처해서 올리세요.</div>
      <div class="row"><input type="file" id="img" accept="image/*"></div>
    </div>
    <div class="card">
      <div class="item">② 텍스트 붙여넣기로 추가</div>
      <div class="muted">주문내역 페이지, 주문확인 메일, 카드 결제 문자/명세서를 복사해 붙여넣으세요.</div>
      <div class="row"><textarea id="paste" placeholder="여기에 붙여넣기"></textarea></div>
      <button class="btn" id="btnExtract">내용 읽기</button>
    </div>
    <div class="card">
      <div class="item">③ 직접 입력</div>
      <div class="row"><button class="btn ghost" id="btnManual">빈 항목 만들기</button></div>
    </div>
    <div class="status" id="addStatus"></div>
    <div id="preview"></div>
    <div class="row" id="saveRow" style="display:none"><button class="btn" id="btnSave">모두 저장</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
    <div class="row">
      <button class="btn ghost" id="btnSync">지금 Gmail 확인</button>
      <span class="muted" id="syncStatus"></span>
    </div>
    <div class="muted" id="appStatus"></div>
  </section>

  <!-- 결제처 확인 -->
  <section class="panel" id="tab-review">
    <div class="muted">카드 내역에 쇼핑몰 대신 결제대행사(KG이니시스, 토스페이먼츠 등)만 찍힌 결제입니다.
      같은 금액·비슷한 날짜의 주문이 있으면 아래에 후보로 보여 드립니다.</div>
    <div class="status" id="reviewStatus"></div>
    <div id="review"></div>
  </section>
</div>

<script>
var FIELDS = [
  ['item', '상품명', 'full'], ['brand', '브랜드'], ['model', '모델명'], ['mall', '구매처(쇼핑몰)'],
  ['date', '구매일 (YYYY-MM-DD)'], ['price', '금액(원)'], ['qty', '수량'], ['payment', '결제수단'],
  ['pg', '결제대행사'], ['orderNo', '주문번호'], ['memo', '메모', 'full']
];
var PG_HINT = /(이니시스|inicis|kcp|토스페이|나이스|nice|다날|danal|ksnet|kicc|스마트로|페이레터|헥토|세틀뱅크|결제대행)/i;
var pendingSource = 'manual';

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function won(n) { n = Number(n) || 0; return n ? n.toLocaleString('ko-KR') + '원' : ''; }
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
  });
}

// 탭
document.querySelectorAll('.tabs button').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('on', p.id === 'tab-' + b.dataset.tab); });
    if (b.dataset.tab === 'review') loadReview();
    if (b.dataset.tab === 'add') loadStatus();
  };
});

// 검색
function mallBadge(r) {
  var name = r.mall || '구매처 미상';
  var pg = !r.mall || PG_HINT.test(r.mall);
  return '<span class="mall' + (pg ? ' pg' : '') + '">' + esc(name) + '</span>' +
    (pg ? ' <span class="muted">결제대행사 표기 — 실제 쇼핑몰 확인 필요</span>' : '');
}
function sourceLink(r) {
  if (r.source === 'gmail' && r.sourceRef)
    return ' · <a href="https://mail.google.com/mail/u/0/#all/' + encodeURIComponent(r.sourceRef) + '" target="_blank">원본 메일</a>';
  return r.source ? ' · ' + esc({ paste: '붙여넣기', image: '캡처', manual: '직접입력' }[r.source] || r.source) : '';
}
function resultCard(r) {
  return '<div class="card" data-id="' + esc(r.id) + '">' +
    '<span class="price">' + esc(won(r.price)) + '</span>' +
    '<div class="item">' + esc(r.item || '(상품명 없음)') + '</div>' +
    '<div class="meta">' + mallBadge(r) + '</div>' +
    '<div class="meta">' + esc(r.date || '날짜 미상') +
      (r.brand ? ' · ' + esc(r.brand) : '') + (r.model ? ' · ' + esc(r.model) : '') +
      (r.qty > 1 ? ' · ' + r.qty + '개' : '') + (r.payment ? ' · ' + esc(r.payment) : '') +
      (r.orderNo ? ' · 주문번호 ' + esc(r.orderNo) : '') + sourceLink(r) + '</div>' +
    (r.memo ? '<div class="meta">' + esc(r.memo) + '</div>' : '') +
    '<div class="actions"><button class="link" data-edit>수정</button><button class="link" data-del>삭제</button></div>' +
    '</div>';
}

var timer, lastRows = [];
$('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(runSearch, 250); });
function runSearch() {
  var q = $('q').value;
  $('searchStatus').textContent = '검색 중…';
  call('apiSearch', q).then(function (rows) {
    lastRows = rows;
    $('searchStatus').textContent = q ? rows.length + '건 찾음' : '최근 구매 ' + rows.length + '건';
    $('results').innerHTML = rows.length ? rows.map(resultCard).join('') :
      '<div class="card muted">찾는 구매기록이 없습니다. 다른 이름(영문/한글, 모델명)으로도 검색해 보세요.</div>';
  }).catch(showErr('searchStatus'));
}
$('results').addEventListener('click', function (e) {
  var card = e.target.closest('.card[data-id]'); if (!card) return;
  var id = card.dataset.id;
  var r = lastRows.filter(function (x) { return x.id === id; })[0];
  if (e.target.hasAttribute('data-del')) {
    if (!confirm('이 기록을 삭제할까요?')) return;
    call('apiDelete', id).then(runSearch).catch(showErr('searchStatus'));
  }
  if (e.target.hasAttribute('data-edit')) {
    card.innerHTML = editForm(r) + '<div class="actions"><button class="btn" data-save>저장</button>' +
      '<button class="btn ghost" data-cancel>취소</button></div>';
  }
  if (e.target.hasAttribute('data-cancel')) runSearch();
  if (e.target.hasAttribute('data-save')) {
    call('apiUpdate', id, readForm(card)).then(runSearch).catch(showErr('searchStatus'));
  }
});

// 편집 폼
function editForm(r) {
  return '<div class="edit-grid">' + FIELDS.map(function (f) {
    return '<div class="' + (f[2] || '') + '"><label>' + f[1] + '</label>' +
      '<input data-f="' + f[0] + '" value="' + esc(r[f[0]] == null ? '' : r[f[0]]) + '"></div>';
  }).join('') + '</div>';
}
function readForm(el) {
  var o = {};
  el.querySelectorAll('[data-f]').forEach(function (i) { o[i.dataset.f] = i.value.trim(); });
  o.price = Number(String(o.price).replace(/[^\d]/g, '')) || 0;
  o.qty = Number(o.qty) || 1;
  return o;
}

// 추가: 미리보기 → 저장
function showPreview(rows, source) {
  pendingSource = source;
  if (!rows.length) {
    $('addStatus').textContent = '구매 항목을 찾지 못했습니다. 직접 입력으로 추가할 수 있습니다.';
    return;
  }
  $('addStatus').textContent = rows.length + '건을 읽었습니다. 내용을 확인·수정한 뒤 저장하세요.';
  $('preview').innerHTML = rows.map(function (r) {
    return '<div class="card pv">' + editForm(r) +
      '<div class="actions"><button class="link" data-rm>이 항목 빼기</button></div></div>';
  }).join('');
  $('saveRow').style.display = '';
}
$('preview').addEventListener('click', function (e) {
  if (e.target.hasAttribute('data-rm')) e.target.closest('.pv').remove();
});
$('btnExtract').onclick = function () {
  var text = $('paste').value;
  if (!text.trim()) return;
  $('addStatus').textContent = '읽는 중… (10~30초 걸릴 수 있어요)';
  call('apiExtractFromText', text).then(function (rows) { showPreview(rows, 'paste'); })
    .catch(showErr('addStatus'));
};
$('btnManual').onclick = function () { showPreview([{ qty: 1 }], 'manual'); };
$('img').onchange = function () {
  var file = this.files[0]; if (!file) return;
  $('addStatus').textContent = '이미지 읽는 중… (10~30초 걸릴 수 있어요)';
  shrinkImage(file, 1600).then(function (dataUrl) {
    return call('apiExtractFromImage', dataUrl.split(',')[1], 'image/jpeg');
  }).then(function (rows) { showPreview(rows, 'image'); }).catch(showErr('addStatus'));
  this.value = '';
};
$('btnSave').onclick = function () {
  var rows = Array.prototype.map.call(document.querySelectorAll('#preview .pv'), readForm);
  $('btnSave').disabled = true;
  call('apiSave', rows, pendingSource).then(function (n) {
    $('addStatus').textContent = n + '건 저장했습니다.';
    $('preview').innerHTML = ''; $('paste').value = ''; $('saveRow').style.display = 'none';
  }).catch(showErr('addStatus')).then(function () { $('btnSave').disabled = false; });
};
$('btnSync').onclick = function () {
  $('syncStatus').textContent = '메일 확인 중… (최대 몇 분)';
  call('apiSyncNow').then(function (msg) { $('syncStatus').textContent = msg; loadStatus(); })
    .catch(showErr('syncStatus'));
};

// 큰 사진은 전송 전에 줄입니다
function shrinkImage(file, maxSide) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, maxSide / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { reject(new Error('이미지를 열 수 없습니다.')); };
    img.src = URL.createObjectURL(file);
  });
}

// 결제처 확인
var reviewItems = [];
function loadReview() {
  $('reviewStatus').textContent = '불러오는 중…';
  call('apiNeedsReview').then(function (items) {
    reviewItems = items;
    $('reviewStatus').textContent = items.length ? items.length + '건' : '확인이 필요한 결제가 없습니다. 👍';
    $('review').innerHTML = items.map(function (it, idx) {
      var p = it.payment;
      return '<div class="card">' + '<span class="price">' + esc(won(p.price)) + '</span>' +
        '<div class="item">' + esc(p.mall || '구매처 미상') + '</div>' +
        '<div class="meta">' + esc(p.date) + (p.item ? ' · ' + esc(p.item) : '') + sourceLink(p) + '</div>' +
        (it.candidates.length ? it.candidates.map(function (c) {
          return '<div class="cand"><div><b>' + esc(c.item) + '</b></div>' +
            '<div class="meta">' + mallBadge(c) + ' · ' + esc(c.date) + ' · ' + esc(won(c.price)) + '</div>' +
            '<div class="actions"><button class="btn ghost" data-merge="' + idx + '" data-keep="' + esc(c.id) +
            '">이 주문의 결제가 맞아요 (합치기)</button></div></div>';
        }).join('') : '<div class="meta">같은 금액의 주문 기록이 없습니다. 쇼핑몰 앱의 주문내역을 캡처해서 추가해 보세요.</div>') +
        '</div>';
    }).join('');
  }).catch(showErr('reviewStatus'));
}
$('review').addEventListener('click', function (e) {
  var b = e.target.closest('[data-merge]'); if (!b) return;
  var drop = reviewItems[+b.dataset.merge].payment.id;
  call('apiMerge', b.dataset.keep, drop).then(loadReview).catch(showErr('reviewStatus'));
});

function loadStatus() {
  call('apiStatus').then(function (s) {
    $('appStatus').innerHTML = '저장된 구매기록 ' + s.count + '건 · AI 인식 ' +
      (s.hasApiKey ? '켜짐 (' + esc(s.model) + ')' : '<b>꺼짐</b> — 캡처 인식을 쓰려면 API 키를 등록하세요') +
      ' · <a href="' + esc(s.spreadsheetUrl) + '" target="_blank">스프레드시트 열기</a>';
  });
}
function showErr(id) { return function (e) { $(id).textContent = '오류: ' + (e && e.message || e); }; }

runSearch();
</script>
</body>
</html>
