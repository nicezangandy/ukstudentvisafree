<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서비스 종료 안내 | 영국유학 비자지원센터</title>

<!-- 새 주소로 자동 이동 -->
<meta http-equiv="refresh" content="0; url=https://ukvisa.kr/">
<link rel="canonical" href="https://ukvisa.kr/">
<meta name="description" content="이 페이지의 영국 학생비자 지원 서비스는 종료되었습니다. 새 주소 ukvisa.kr 에서 계속 이용하실 수 있습니다.">

<meta property="og:title" content="서비스 종료 안내 | 영국유학 비자지원센터">
<meta property="og:description" content="새 주소 ukvisa.kr 로 이동합니다.">
<meta property="og:url" content="https://ukvisa.kr/">

<style>
  :root {
    color-scheme: light;
    --bg: #f6f7fb;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #667eea;
    --brand-dark: #5a67d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
    line-height: 1.7;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .07);
  }
  .logo { width: 88px; height: auto; margin-bottom: 24px; }
  h1 { margin: 0 0 12px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  .new-address {
    display: block;
    margin: 24px 0;
    padding: 14px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    background: #fafbff;
    word-break: break-all;
  }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color .2s ease;
  }
  .btn:hover, .btn:focus { background: var(--brand-dark); }
  .note { margin: 24px 0 0; font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) {
    .card { padding: 32px 22px; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="영국유학 비자지원센터" class="logo">

    <h1>이 페이지는 새 주소로 이동했습니다</h1>

    <p>
      기존 <strong>영국 무료 학생비자 지원 서비스</strong> 안내 페이지는 운영을 종료했습니다.<br>
      아래 새 주소에서 계속 이용하실 수 있습니다.
    </p>

    <span class="new-address">ukvisa.kr</span>

    <a class="btn" href="https://ukvisa.kr/">새 사이트로 이동하기</a>

    <p class="note">
      잠시 후 자동으로 이동합니다.<br>
      이동되지 않으면 위 버튼을 눌러 주세요.
    </p>
  </main>

  <script>
    // meta refresh가 차단된 환경을 위한 보조 이동
    setTimeout(function () {
      window.location.replace("https://ukvisa.kr/");
    }, 1200);
  </script>
</body>
</html>
